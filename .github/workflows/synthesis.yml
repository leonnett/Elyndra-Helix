name: Helix synthesis comparison

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  synthesis:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned Python and Yosys dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Install Verilator build dependencies
        run: sudo apt-get update && sudo apt-get install --yes autoconf flex bison g++ make perl python3 zlib1g-dev
      - name: Build pinned Verilator release
        run: |
          git clone --depth 1 --branch v5.036 https://github.com/verilator/verilator.git /tmp/helix-verilator
          cd /tmp/helix-verilator
          autoconf
          ./configure --prefix=/usr/local
          make -j2
          sudo make install
          verilator --version
          yosys -V
      - name: Run static checks and diagram validation
        run: make check diagrams
      - name: Lint and synthesize all HAEF configurations
        run: make synthesis
      - name: Compare variants and generate reports
        if: always()
        run: |
          if test -f results/synthesis/synthesis-report.json; then make compare; fi
          python scripts/generate_report.py --scope synthesis
      - name: Upload synthesis evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: helix-synthesis-evidence
          path: |
            results/synthesis/
            results/comparison/
            results/report/synthesis.*
            build/synthesis/
          if-no-files-found: warn
          retention-days: 30
