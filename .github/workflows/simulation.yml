name: Helix simulation

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  simulation:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned Python dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Install Verilator build dependencies
        run: sudo apt-get update && sudo apt-get install --yes autoconf flex bison g++ make perl python3 zlib1g-dev
      - name: Build pinned Verilator release
        run: |
          git clone --depth 1 --branch v5.036 https://github.com/verilator/verilator.git /tmp/helix-verilator
          cd /tmp/helix-verilator
          autoconf
          ./configure --prefix=/usr/local
          make -j2
          sudo make install
          verilator --version
      - name: Run static checks
        run: make check diagrams
      - name: Run Cocotb processor and unit suites
        env:
          HELIX_SEED: "1212231729"
        run: make simulation
      - name: Generate simulation summary
        if: always()
        run: python scripts/generate_report.py --scope simulation
      - name: Upload simulation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: helix-simulation-evidence
          path: |
            results/simulation/
            results/report/simulation.*
            build/simulation/
          if-no-files-found: warn
          retention-days: 30
