[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elyndra-helix-h1"
version = "0.1.0"
description = "Reproducible RV32I processor architecture research"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cocotb==2.0.0",
    "yowasp-yosys==0.69.0.0.post1233",
]

[tool.ruff]
line-length = 120
target-version = "py312"
